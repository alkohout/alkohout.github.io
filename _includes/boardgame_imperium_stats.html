
<script src="./config.js"></script>
<script src="./api.js"></script>
<script src="./tabs.js"></script>
<script>
    requireAuth();
    renderTabs('games');

    const esc = s => String(s ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    async function load() {
        const data = await apiGet('/api/imperium_stats');
        const body = document.getElementById('body');
        if (!data) return;
        if (data.success === false) {
            body.innerHTML = `<p class="status-err">${esc(data.message || 'Not allowed.')}</p>`;
            return;
        }

        let totalWon = 0, totalLost = 0;
        const rows = data.expansions.map(group => {
            const civs = group.civilisations.map(c => {
                totalWon += c.won; totalLost += c.lost;
                // Greyed means never faced, not never finished. A deck you
                // sat down to and left mid-game still counts as tried.
                const played = (c.plays || c.won + c.lost) > 0;
                return `<tr class="civ${played ? '' : ' unplayed'}">
                    <td>${esc(c.name)}<span class="stars">${'★'.repeat(c.stars)}</span></td>
                    <td class="num lost">${c.lost || ''}</td>
                    <td class="num won">${c.won || ''}</td>
                </tr>`;
            }).join('');
            return `<tr class="exp-row"><td colspan="3">${esc(group.expansion)}</td></tr>${civs}`;
        }).join('');

        const unmatched = data.unmatched_levels.length
            ? `<p class="unmatched">Not matched to a civilisation:
                 ${data.unmatched_levels.map(esc).join(', ')}</p>`
            : '';

        body.innerHTML = `
            <table class="civs">
                <thead><tr><th></th><th>Lost</th><th>Won</th></tr></thead>
                <tbody>
                    ${rows}
                    <tr class="totals">
                        <td>Total — ${data.total_games} finished</td>
                        <td class="num lost">${totalLost}</td>
                        <td class="num won">${totalWon}</td>
                    </tr>
                </tbody>
            </table>${unmatched}`;
    }
    load();
</script>
