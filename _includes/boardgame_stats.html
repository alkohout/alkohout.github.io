
<!-- The panel is static markup; one call fills every figure in it. -->
<div class="stats-grid">
    <div><span class="stat-label">Today</span><span id="s-td">—</span></div>
    <div><span class="stat-label">Yesterday</span><span id="s-yd">—</span></div>
    <div><span class="stat-label">Daily average</span><span id="s-ad">—</span></div>
    <div><span class="stat-label">This week</span><span id="s-tw">—</span></div>
    <div><span class="stat-label">This month</span><span id="s-tm">—</span></div>
    <div><span class="stat-label">This year</span><span id="s-ty">—</span></div>
</div>
<h3>Most played</h3>
<table id="most-played">
    <tr><td>This week</td><td id="mp-tw-g">—</td><td id="mp-tw-c">0</td></tr>
    <tr><td>Last week</td><td id="mp-lw-g">—</td><td id="mp-lw-c">0</td></tr>
    <tr><td>This year</td><td id="mp-ty-g">—</td><td id="mp-ty-c">0</td></tr>
</table>
<ul id="top-games"></ul>

<script>
async function loadStats() {
    // apiGet attaches the bearer token and bounces to the login page on a 401.
    const d = await apiGet('/api/dashboard');
    if (!d) return;

    const gp = d.games_played;
    document.getElementById('s-td').textContent = gp.today;
    document.getElementById('s-yd').textContent = gp.yesterday;
    document.getElementById('s-ad').textContent = gp.daily_avg;
    document.getElementById('s-tw').textContent = gp.this_week;
    document.getElementById('s-tm').textContent = gp.this_month;
    document.getElementById('s-ty').textContent = gp.this_year;

    const mp = d.most_played;
    [['tw', mp.this_week], ['lw', mp.last_week], ['ty', mp.this_year]]
        .forEach(([k, v]) => {
            document.getElementById('mp-' + k + '-g').textContent = v.game || '—';
            document.getElementById('mp-' + k + '-c').textContent = v.count || 0;
        });

    document.getElementById('top-games').innerHTML =
        d.top_games.map(g => `<li>${escapeHtml(g.game)} — ${g.count}</li>`).join('');

    renderRecords(d.records, gp);
}
loadStats();
</script>
