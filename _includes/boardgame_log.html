
<!-- The form is static HTML on GitHub Pages. Game-specific field blocks are
     hidden until the title calls for them; only two are shown here. -->
<div class="form-container">
    <h2>Log a Game</h2>
    <label>Date Played: <span id="date-weekday"></span></label>
    <input type="date" id="date_played">
    <label>Game Title:</label>
    <div style="position:relative;">
        <input type="text" id="game_title" autocomplete="off">
        <div id="add_suggestions" class="autocomplete-suggestions"></div>
    </div>
    <label>Result:</label>
    <textarea id="result" rows="1" placeholder="Add result here..."></textarea>

    <!-- Spirit Island records three things that vary independently, so they get
         their own fields rather than being crammed into Level. Hidden until the
         title says Spirit Island. -->
    <div id="si-fields" style="display:none;">
        <label>Spirit:</label>
        <select id="spirit"><option value="">—</option></select>
        <label>Adversary:</label>
        <select id="adversary"><option value="">—</option></select>
        <select id="adversary_level"><option value="">Lvl</option></select>
        <label>Scenario:</label>
        <select id="scenario"><option value="">—</option></select>
    </div>

    <!-- Ark Nova: the map and the appeal you start the bot on are the setup,
         and the pair is what gets climbed. -->
    <div id="an-fields" style="display:none;">
        <label>Map:</label>
        <select id="zoo_map"><option value="">—</option></select>
        <label>Start appeal:</label>
        <input type="number" id="start_appeal" min="0" max="100" step="1">
    </div>

    <label>Notes:</label>
    <textarea id="notes" rows="4" placeholder="Add any notes here..."></textarea>
    <button id="log-btn">Log Game</button>
    <p id="log-status" style="display:none;"></p>
</div>

<script>
document.getElementById('log-btn').addEventListener('click', async () => {
    const title = document.getElementById('game_title').value.trim();
    const dp = document.getElementById('date_played').value;
    if (!title || !dp) { alert('Date and game title are required.'); return; }

    const payload = {
        date_played: dp, game_title: title,
        result: document.getElementById('result').value,
        notes: document.getElementById('notes').value
    };
    // Only send them for a Spirit Island play; the API ignores unknown names
    // anyway, but there is no reason to send four empty fields every time.
    if (isSpiritIsland(title)) {
        SI_FIELDS.forEach(id => payload[id] = document.getElementById(id).value);
    }
    if (isArkNova(title)) {
        AN_FIELDS.forEach(id => payload[id] = document.getElementById(id).value);
    }

    const data = await apiPost('/api/add_game', payload);

    // The photo needs the id of the row that was just written, so it goes up
    // after the play rather than with it.
    if (data?.success && pendingPhoto && data.id) {
        await uploadPhoto(data.id, pendingPhoto);
    }
    document.getElementById('log-status').textContent =
        data?.success ? 'Logged!' : (data?.message || 'Failed');
});
</script>
